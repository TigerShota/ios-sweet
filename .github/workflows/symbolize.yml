name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download SystemOS DMG + extract all cache subvolumes
        run: |
          URL=$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW: $URL"
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg .
          sudo apt-get update && sudo apt-get install -y libfuse3-dev libicu-dev zlib1g-dev libbz2-dev liblzma-dev build-essential cmake git
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build > /dev/null
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)" > /dev/null
          sudo cmake --install /tmp/apfs-fuse/build > /dev/null
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229
          sudo chmod 666 /dev/fuse
          sudo mkdir -p /mnt/sysos /tmp/dsc
          for try in 1 2 3; do
            sudo umount /mnt/sysos 2>/dev/null || true
            sudo apfs-fuse 087-86593-047.dmg /mnt/sysos 2>&1 | tail -1 || true
            DIR=$(dirname "$(sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache_arm64' ! -path '*DriverKit*' ! -path '*Cryptexes/App*' | head -1)")
            echo "attempt $try: DIR=$DIR"
            if [ -n "$DIR" ]; then
              ok=1
              for f in "$DIR"/dyld_shared_cache_arm64*; do
                case "$f" in *.symbols) continue;; esac
                sudo cp "$f" /tmp/dsc/ || ok=0
              done
              [ "$ok" = 1 ] && break
            fi
            sleep 5
          done
          ls /tmp/dsc | head -8
          ls /tmp/dsc | wc -l

      - name: Locate image by scanning every subcache
        run: |
          sudo python3 - <<'PYEOF'
          import struct, glob, bisect

          cache_off = int("${{ inputs.addr }}", 16)
          target = 0x180000000 + cache_off   # unslid VM address
          print('target VM:', hex(target))

          files = sorted(glob.glob('/tmp/dsc/dyld_shared_cache_arm64*'))
          all_images = []   # (loadAddress, file, pathOffset)
          for fn in files:
              with open(fn, 'rb') as f:
                  h = f.read(0x140)
                  if len(h) < 0x140:
                      continue
                  magic, = struct.unpack_from('<I', h, 0)
                  if magic != 0x646c7964:
                      continue
                  mo, mc = struct.unpack_from('<II', h, 0x10)
                  # dyldInCacheMH@0x78, dyldInCacheEntry@0x80, imagesTextOffset@0x88, imagesTextCount@0x90
                  mho, ito = struct.unpack_from('<Q', h, 0x88)
                  itc, = struct.unpack_from('<Q', h, 0x90)
                  # mapping range
                  f.seek(mo)
                  maps = []
                  for i in range(mc):
                      a, s, o, mx, init, fl = struct.unpack('<QQQIIi', f.read(32))
                      maps.append((a, s))
                  # imagesText table: 32-byte entries
                  if itc and itc < 4000 and ito and ito + itc*32 < 0x40000000:
                      f.seek(ito)
                      for i in range(itc):
                          e = f.read(32)
                          if len(e) < 32:
                              break
                          uu = e[:16]
                          la, ts, po = struct.unpack_from('<QII', e, 16)
                          if la == 0:
                              continue
                          all_images.append((la, ts, fn, po))
                  print(fn.split('/')[-1], 'maps:', [(hex(a), hex(s)) for a, s in maps], 'images:', itc if itc < 4000 else '?')

          all_images.sort()
          print('total images:', len(all_images))
          # which image holds target
          best = None
          for la, ts, fn, po in all_images:
              if la <= target < la + max(ts, 0x1000):
                  best = (la, ts, fn, po)
                  break
          if not best:
              # fall back: nearest below
              below = [t for t in all_images if t[0] <= target]
              best = below[-1] if below else None
          if best:
              la, ts, fn, po = best
              f = open(fn, 'rb')
              f.seek(po)
              path = f.read(512).split(b'\0')[0].decode(errors='replace')
              print('=== RESULT ===')
              print('IMAGE:', path)
              print('loadAddress:', hex(la), 'textSize:', hex(ts))
              print('offset in image:', hex(target - la))
              print('file:', fn.split('/')[-1])
          else:
              print('no image found')
          PYEOF

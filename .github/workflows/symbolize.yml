name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ipsw tool
        run: |
          ASSET=$(curl -fsSL https://api.github.com/repos/blacktop/ipsw/releases/latest | jq -r '.assets[] | select(.name | test("^ipsw_.*_linux_x86_64\\.tar\\.gz$")) | .browser_download_url')
          curl -fsSL -o /tmp/ipsw.tgz "$ASSET"
          tar xf /tmp/ipsw.tgz -C /tmp
          BIN=$(find /tmp -type f -name ipsw | head -1)
          sudo install -m755 "$BIN" /usr/local/bin/ipsw
          ipsw version

      - name: Download SystemOS DMG + extract MAIN dyld cache
        run: |
          URL=$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW: $URL"
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg .
          sudo apt-get update && sudo apt-get install -y libfuse3-dev libicu-dev zlib1g-dev libbz2-dev liblzma-dev build-essential cmake git
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build > /dev/null
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)" > /dev/null
          sudo cmake --install /tmp/apfs-fuse/build > /dev/null
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229
          sudo chmod 666 /dev/fuse
          sudo mkdir -p /mnt/sysos
          sudo apfs-fuse 087-86593-047.dmg /mnt/sysos 2>&1 | tail -1 || true
          echo "--- all dyld caches found ---"
          sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache*' | head -20
          CACHE=$(sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache_arm64' ! -path '*DriverKit*' ! -path '*Cryptexes/App*' | head -1)
          echo "MAIN CACHE=$CACHE"
          sudo cp "$CACHE" /tmp/dsc.bin
          sudo cp "${CACHE}.symbols" /tmp/dsc.symbols 2>/dev/null || true
          ls -la /tmp/dsc.*

      - name: Symbolize
        run: |
          ADDR="${{ inputs.addr }}"
          echo "=== symbolizing $ADDR ==="
          # image containing the address
          ipsw dyld info /tmp/dsc.bin --images 2>/dev/null > /tmp/images.txt || true
          wc -l /tmp/images.txt
          head -5 /tmp/images.txt
          python3 - <<PYEOF
          import subprocess, re
          addr = int("${{ inputs.addr }}", 16)
          # find the image whose [base, base+size) contains addr
          best = None
          try:
              out = subprocess.run(['ipsw','dyld','info','/tmp/dsc.bin','--images'],
                                   capture_output=True, text=True).stdout
              print(out[:1500])
          except Exception as e:
              print('ERR', e)
          PYEOF
          # ipsw dyld split then use nm-style dump
          ipsw dyld split /tmp/dsc.bin --output /tmp/split 2>/dev/null || mkdir -p /tmp/split
          ls /tmp/split 2>/dev/null | head -10 || true

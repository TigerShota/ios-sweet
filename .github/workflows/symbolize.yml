name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download SystemOS DMG + extract dyld cache (all subcaches)
        run: |
          URL=$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW: $URL"
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg .
          sudo apt-get update && sudo apt-get install -y libfuse3-dev libicu-dev zlib1g-dev libbz2-dev liblzma-dev build-essential cmake git
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build > /dev/null
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)" > /dev/null
          sudo cmake --install /tmp/apfs-fuse/build > /dev/null
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229
          sudo chmod 666 /dev/fuse
          sudo mkdir -p /mnt/sysos /tmp/dsc
          for try in 1 2 3; do
            sudo umount /mnt/sysos 2>/dev/null || true
            sudo apfs-fuse 087-86593-047.dmg /mnt/sysos 2>&1 | tail -1 || true
            DIR=$(dirname "$(sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache_arm64' ! -path '*DriverKit*' ! -path '*Cryptexes/App*' | head -1)")
            echo "attempt $try: DIR=$DIR"
            if [ -n "$DIR" ]; then
              sudo cp -v "$DIR/dyld_shared_cache_arm64" /tmp/dsc/ && break
            fi
            sleep 5
          done
          ls -la /tmp/dsc
          [ -f /tmp/dsc/dyld_shared_cache_arm64 ] || { echo "FATAL: header cache not copied"; exit 1; }

      - name: Parse header + subcaches, locate image and symbol
        run: |
          sudo python3 - <<'PYEOF'
          import struct, glob, bisect

          addr = int("${{ inputs.addr }}", 16)
          files = sorted(glob.glob('/tmp/dsc/dyld_shared_cache_arm64*'))
          print('files:', [f.split('/')[-1] for f in files])

          # find the file that holds the real cache header: mappingCount > 0
          hdr_file = None
          for fn in files:
              with open(fn, 'rb') as f:
                  h = f.read(0x80)
                  if len(h) < 0x80:
                      continue
                  magic, = struct.unpack_from('<I', h, 0)
                  if magic != 0x646c7964:
                      continue
                  mo, mc = struct.unpack_from('<II', h, 0x10)
                  print(fn.split('/')[-1], 'magic ok, mappingOffset', mo, 'mappingCount', mc)
                  if mc and mc < 20:
                      hdr_file = (fn, mo, mc)
                      break
          if not hdr_file:
              print('no real header found, dump first 256 bytes of bare file:')
              with open('/tmp/dsc/dyld_shared_cache_arm64','rb') as f:
                  d = f.read(256)
              for i in range(0, 256, 32):
                  print(' '.join(f'{b:02x}' for b in d[i:i+32]))
              raise SystemExit(1)
          fn, mappingOffset, mappingCount = hdr_file
          print('HEADER FILE:', fn)

          f = open(fn, 'rb')
          hdr = f.read(0x200)
          # scan header for plausible (imagesOffset, imagesCount) pairs: both < 64MB, count in (100, 2000)
          cands = []
          for off in range(0x10, 0x100, 4):
              a, c = struct.unpack_from('<II', hdr, off)
              if 0x1000 < a < 0x4000000 and 100 < c < 2000:
                  cands.append((off, a, c))
          print('image table candidates (offset, imagesOffset, imagesCount):', cands)
          PYEOF

name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"
      root_run_id:
        description: "gauguin-root run ID (default: latest successful)"
        required: false
        default: ""

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download root image artifact + loop-mount HFS+
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_ID: ${{ inputs.root_run_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y hfsprogs
          if [ -z "$ROOT_ID" ]; then
            ROOT_ID=$(gh run list --workflow gauguin-root.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "root run: $ROOT_ID"
          gh run download "$ROOT_ID" -R "$GITHUB_REPOSITORY" -n ios16-root -D parts
          cat parts/root.part-* > root.img.gz
          rm -rf parts
          gunzip -1 -f root.img.gz || true
          ls -la root.img*
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force root.img /mnt/iosroot || sudo fsck.hfsplus -f -y root.img && sudo mount -t hfsplus -o loop,force root.img /mnt/iosroot
          ls /mnt/iosroot
          sudo mkdir -p /tmp/dsc
          sudo cp /mnt/iosroot/System/Library/Caches/com.apple.dyld/dyld_shared_cache_arm64* /tmp/dsc/ || \
            sudo cp "/mnt/iosroot/private/preboot/Cryptexes/OS/System/Library/Caches/com.apple.dyld"/dyld_shared_cache_arm64* /tmp/dsc/
          ls -la /tmp/dsc | head -8
          ls /tmp/dsc | wc -l

      - name: Locate image by scanning every subcache
        run: |
          sudo python3 - <<'PYEOF'
          import struct, glob

          cache_off = int("${{ inputs.addr }}", 16)
          target = 0x180000000 + cache_off   # unslid VM address
          print('target VM:', hex(target))

          files = sorted(glob.glob('/tmp/dsc/dyld_shared_cache_arm64*'))
          all_images = []
          for fn in files:
              with open(fn, 'rb') as f:
                  h = f.read(0x140)
                  if len(h) < 0x140:
                      continue
                  magic, = struct.unpack_from('<I', h, 0)
                  if magic != 0x646c7964:
                      continue
                  mo, mc = struct.unpack_from('<II', h, 0x10)
                  ito, = struct.unpack_from('<Q', h, 0x88)
                  itc, = struct.unpack_from('<Q', h, 0x90)
                  maps = []
                  f.seek(mo)
                  for i in range(mc):
                      a, s, o, mx, init, fl = struct.unpack('<QQQIIi', f.read(32))
                      maps.append((a, s))
                  n = 0
                  if itc and itc < 4000 and ito:
                      f.seek(ito)
                      for i in range(itc):
                          e = f.read(32)
                          if len(e) < 32:
                              break
                          la, ts, po = struct.unpack_from('<QII', e, 16)
                          if la == 0:
                              continue
                          all_images.append((la, ts, fn, po))
                          n += 1
                  print(fn.split('/')[-1], 'maps:', [(hex(a), hex(s)) for a,s in maps], 'images:', n)

          all_images.sort()
          print('total images:', len(all_images))
          hit = None
          for la, ts, fn, po in all_images:
              if la <= target < la + max(ts, 0x4000):
                  hit = (la, ts, fn, po)
                  break
          if not hit:
              below = [t for t in all_images if t[0] <= target]
              hit = below[-1] if below else None
          if hit:
              la, ts, fn, po = hit
              with open(fn, 'rb') as f:
                  f.seek(po)
                  path = f.read(512).split(b'\0')[0].decode(errors='replace')
              print('=== RESULT ===')
              print('IMAGE:', path)
              print('loadAddress:', hex(la), 'textSize:', hex(ts))
              print('offset in image:', hex(target - la))
              print('file:', fn.split('/')[-1])
          else:
              print('no image found')
          PYEOF

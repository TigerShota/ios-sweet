name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download SystemOS DMG + extract MAIN dyld cache
        run: |
          URL=$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW: $URL"
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg .
          sudo apt-get update && sudo apt-get install -y libfuse3-dev libicu-dev zlib1g-dev libbz2-dev liblzma-dev build-essential cmake git
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build > /dev/null
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)" > /dev/null
          sudo cmake --install /tmp/apfs-fuse/build > /dev/null
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229
          sudo chmod 666 /dev/fuse
          sudo mkdir -p /mnt/sysos
          sudo apfs-fuse 087-86593-047.dmg /mnt/sysos 2>&1 | tail -1 || true
          CACHE=$(sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache_arm64' ! -path '*DriverKit*' ! -path '*Cryptexes/App*' | head -1)
          echo "MAIN CACHE=$CACHE"
          sudo cp "$CACHE" /tmp/dsc.bin
          sudo cp "${CACHE}.symbols" /tmp/dsc.symbols 2>/dev/null || true
          ls -la /tmp/dsc.*

      - name: Parse cache header + locate image
        run: |
          python3 - <<'PYEOF'
          import struct

          addr = int("${{ inputs.addr }}", 16)
          f = open('/tmp/dsc.bin', 'rb')
          hdr = f.read(0x140)
          magic, = struct.unpack_from('<I', hdr, 0)
          print('magic:', hex(magic))
          # dyld_cache_header (arm64, v1): uuid(16) @4, cacheType @20(4), ...
          # mappingOffset @32? layout differs by version; print fields
          mappingOffset, mappingCount = struct.unpack_from('<II', hdr, 0x20)
          print('mappingOffset:', mappingOffset, 'mappingCount:', mappingCount)
          imagesOffsetOld, imagesCountOld = struct.unpack_from('<II', hdr, 0x28)
          print('imagesOffset(old):', imagesOffsetOld, 'imagesCount(old):', imagesCountOld)
          dyldInCacheMH, codesignOffset, codesignSize = struct.unpack_from('<QQQ', hdr, 0x30)
          slideInfoOffset, slideInfoSize = struct.unpack_from('<QQ', hdr, 0x48)
          print('slideInfo:', hex(slideInfoOffset), slideInfoSize)

          # mappings
          f.seek(mappingOffset)
          for i in range(mappingCount):
              m = f.read(32)
              addr_o, size_o, off_o, maxProt, initProt, flags = struct.unpack('<QQQIIi', m)
              print(f'mapping {i}: addr {hex(addr_o)} size {hex(size_o)} file {hex(off_o)} prot {initProt:#x}')
              if addr_o <= addr < addr_o + size_o:
                  file_off = off_o + (addr - addr_o)
                  print(f'  -> ADDR in this mapping, file offset {hex(file_off)}')

          # images (dyld_cache_image_info: addr(8) modTime(8) inode(8) pathFileOffset(4) pad(4))
          if imagesCountOld and imagesCountOld < 10000:
              f.seek(imagesOffsetOld)
              best = None
              for i in range(imagesCountOld):
                  rec = f.read(32)
                  iaddr, mtime, inode, pathOff, pad = struct.unpack('<QQQII', rec)
                  if iaddr == 0: continue
                  if best is None or (iaddr <= addr and (best is None or iaddr > best[0])):
                      if iaddr <= addr:
                          best = (iaddr, pathOff)
              if best:
                  f.seek(best[1])
                  path = f.read(400).split(b'\0')[0].decode()
                  print('IMAGE:', path, 'base:', hex(best[0]), 'offset in image:', hex(addr - best[0]))
          PYEOF

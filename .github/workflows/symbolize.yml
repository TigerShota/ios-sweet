name: symbolize

on:
  workflow_dispatch:
    inputs:
      addr:
        description: "cache-relative address to symbolize (hex, e.g. 0x42611ad0)"
        required: true
        default: "0x42611ad0"

jobs:
  sym:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download SystemOS DMG + extract dyld cache (all subcaches)
        run: |
          URL=$(curl -fsSL "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | jq -r '.firmwares[] | select(.version=="16.7.16") | .url')
          echo "IPSW: $URL"
          python3 tools/remotezip.py "$URL" 087-86593-047.dmg .
          sudo apt-get update && sudo apt-get install -y libfuse3-dev libicu-dev zlib1g-dev libbz2-dev liblzma-dev build-essential cmake git
          git clone --depth 1 --recurse-submodules https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
          cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build > /dev/null
          cmake --build /tmp/apfs-fuse/build -j"$(nproc)" > /dev/null
          sudo cmake --install /tmp/apfs-fuse/build > /dev/null
          [ -e /dev/fuse ] || sudo mknod /dev/fuse c 10 229
          sudo chmod 666 /dev/fuse
          sudo mkdir -p /mnt/sysos
          sudo apfs-fuse 087-86593-047.dmg /mnt/sysos 2>&1 | tail -1 || true
          DIR=$(dirname "$(sudo find /mnt/sysos -path '*com.apple.dyld*' -name 'dyld_shared_cache_arm64' ! -path '*DriverKit*' ! -path '*Cryptexes/App*' | head -1)")
          echo "DIR=$DIR"
          sudo ls -la "$DIR" | head -60
          sudo mkdir -p /tmp/dsc
          sudo cp "$DIR"/dyld_shared_cache_arm64* /tmp/dsc/
          ls -la /tmp/dsc | head -10

      - name: Parse header + subcaches, locate image and symbol
        run: |
          sudo python3 - <<'PYEOF'
          import struct, glob, bisect

          addr = int("${{ inputs.addr }}", 16)
          base = '/tmp/dsc/dyld_shared_cache_arm64'
          f = open(base, 'rb')
          hdr = f.read(0x1c0)
          magic, = struct.unpack_from('<I', hdr, 0)
          print('magic:', hex(magic))
          # dyld_cache_header: uuid(16)@4, cacheType(4)@20, mappingOffset(4)@32? No:
          # actual: magic(4) uuid(16) cacheType(4) mappingOffset(4) mappingCount(4) imagesOffset(4) imagesCount(4)...
          mappingOffset, mappingCount = struct.unpack_from('<II', hdr, 0x14)
          imagesOffset, imagesCount = struct.unpack_from('<II', hdr, 0x1c)
          print('mappingOffset:', mappingOffset, 'mappingCount:', mappingCount)
          print('imagesOffset:', imagesOffset, 'imagesCount:', imagesCount)
          subcachesOffset, subcachesCount = struct.unpack_from('<II', hdr, 0x50) if len(hdr) > 0x58 else (0, 0)
          print('subcaches:', subcachesOffset, subcachesCount)

          # mappings
          f.seek(mappingOffset)
          mappings = []
          for i in range(mappingCount):
              m = f.read(32)
              a, s, o, mx, init, fl = struct.unpack('<QQQIIi', m)
              mappings.append((a, s, o, init))
              mark = '  <== ADDR HERE' if a <= addr < a + s else ''
              print(f'mapping {i}: addr {hex(a)} size {hex(s)} file {hex(o)} prot {init:#x}{mark}')

          # subcaches (dyld_subcache_entry2: uuid(16) modulus(4)? v1: uuid(16)+fileOffset(4))
          if subcachesCount:
              f.seek(subcachesOffset)
              for i in range(subcachesCount):
                  e = f.read(24)
                  u, fo = struct.unpack_from('<16sI', e, 0)
                  print(f'subcache {i}: fileOffset {hex(fo)}')

          # images
          f.seek(imagesOffset)
          imgs = []
          for i in range(imagesCount):
              rec = f.read(32)
              iaddr, mtime, inode, pathOff, pad = struct.unpack('<QQQII', rec)
              if iaddr:
                  imgs.append((iaddr, pathOff))
          imgs.sort()
          print('images:', len(imgs))
          idx = bisect.bisect_right([a for a,_ in imgs], addr) - 1
          if idx >= 0:
              iaddr, pathOff = imgs[idx]
              # path file offsets are relative to the FILE (whole cache dir), read from the right file
              f.seek(pathOff)
              path = f.read(512).split(b'\0')[0].decode(errors='replace')
              print('IMAGE:', path)
              print('image base:', hex(iaddr), 'offset in image:', hex(addr - iaddr))
          # print neighbors
          for j in (idx+1,):
              if 0 <= j < len(imgs):
                  f.seek(imgs[j][1])
                  print('next image:', f.read(512).split(b'\0')[0].decode(errors='replace'))
          PYEOF

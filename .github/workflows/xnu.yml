name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-15 ships Xcode 16.x only; its iig emits IORPC.kernelContent, which
    # stock xnu-8796 lacks -> patches/0086 back-ports the field + kernel
    # plumbing. (macos-14 / Xcode 15 was retired by GitHub on 2026-11-02.)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build inject blob
        # 0126: the kernel installer reads an archive embedded in the kernel.
        # build.sh only unpacks the XNU tree later, and our patches are copied
        # to dxb/patches by the next step, so generate the C array and ship it
        # as a new-file patch here.
        run: |
          mkdir -p inject-root/private/var/tmp
          printf 'sweet inject test v1\n' > inject-root/private/var/tmp/sweet-inject-test.txt
          python3 tools/mkinject.py inject-root xnu/inject.bin
          python3 tools/mkblob.py xnu/inject.bin inject-blob.c gauguin_inject_blob gauguin_inject_size
          python3 tools/mknewfilepatch.py inject-blob.c bsd/dev/gauguin_inject_blob.c xnu/patches/0126a-gauguin-inject-blob.patch
          head -5 xnu/patches/0126a-gauguin-inject-blob.patch

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # BearSSL's git host 502s to runners - the pinned tree ships in-tree
          cp -R xnu/patches/bearssl-vendor dxb/patches/bearssl-vendor
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that the xcodes binary exists (Xcode is preinstalled)
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          # prefer the oldest Xcode 16 (least clang/iig drift from the Xcode 15
          # this xnu was last green on); bare Xcode.app is the image default
          # (newest: 16.4/26.x) and would win a plain sort|head -1
          XC=$(ls -d /Applications/Xcode_16.1.app 2>/dev/null || true)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
          # Xcode 16 clang trips warnings xnu-8796's -Weverything set never saw
          # on Xcode 15; keep them non-fatal for this migration build (the log
          # still shows every warning for triage). Set to 1 to restore -Werror.
          BUILD_WERROR: "0"
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Fail if any of our patches was skipped
        # build.sh logs a warning and continues when `git apply --check` fails,
        # so a stale hunk silently produces a kernel without that patch (0122/
        # 0123 were lost this way in v74). Four patches shipped by blacktop's
        # darwin-xnu-build legitimately do not apply to this tree; everything
        # else - all of our numbered gauguin/sweet patches - must apply.
        if: always()
        working-directory: dxb
        run: |
          if [ ! -f build.log ]; then echo "no build.log"; exit 1; fi
          SKIPPED=$(grep -a "Skipping patch" build.log || true)
          BAD=$(printf '%s\n' "$SKIPPED" | grep -avE '/(iobuffermemd_monterey|skywalk_sonoma|syntax_checker_sonoma|TrustCache)\.patch' || true)
          if [ -n "$BAD" ]; then
            echo "$BAD"
            echo "::error::one of our patches did not apply; the kernel does not match xnu/patches"
            exit 1
          fi
          echo "all of our patches applied (only the 4 known blacktop skips remain)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-buildlog
          path: dxb/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Dump iig-generated code (Xcode 16 ABI check)
        if: always()
        run: |
          GEN=$(ls -d dxb/build/xnu.obj/*/iokit/DriverKit 2>/dev/null | head -1 || true)
          if [ -z "$GEN" ]; then echo "no generated DriverKit dir (iig never ran)"; exit 0; fi
          echo "=== iig version banners ==="
          head -1 "$GEN"/OSObject.iig.cpp "$GEN"/IOUserServer.iig.cpp 2>/dev/null || true
          echo "=== kernelContent refs in generated code ==="
          grep -n -B2 -A4 'kernelContent' "$GEN"/*.iig.cpp | head -120 || echo "(none)"
          echo "=== IORPCMessageFromMach refs in generated code ==="
          grep -n 'IORPCMessageFromMach' "$GEN"/*.iig.cpp | head -40 || echo "(none)"
          echo "=== OSObject invocation union layout ==="
          grep -n -B2 -A12 'typedef union' "$GEN"/OSObject.iig.cpp | head -80 || true

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
